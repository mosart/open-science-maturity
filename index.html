<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css"> -->
        <link rel="stylesheet" href="oat.min.css">
        <style>
            :root {
                --primary: rgba(6,75,203,1);
                --primary-foreground: rgba(255,255,255,1);
                --warning: rgba(202,138,4,1);
                --destructive: rgba(185,28,28,1);
                --compliant: rgba(13,148,136,1);
                --font-sans: "Source Sans 3", sans-serif;
                --focus-ring: var(--primary);
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --primary: rgba(5,62,170,1);
                    --primary-foreground: rgba(255,255,255,1);
                    --warning: rgba(250,204,21,1);
                    --destructive: rgba(248,113,113,1);
                    --compliant: rgba(16,185,129,1);
                    --focus-ring: rgba(147,197,253,1);
                }
                a {
                    color: rgba(147,197,253,1);
                }
            }

            body {
                margin: 0;
                font-family: var(--font-sans);
            }

            /* The 20pt inset moves from body's margin onto #app here instead of
               staying a body margin: [data-sidebar-layout]'s off-canvas math
               (translateX(-100%) on mobile) assumes the shell sits flush against
               the real viewport edge — a body margin leaves a sliver of the
               sidebar visible past that inset when it's supposed to be hidden. */
            #app-shell > main {
                padding: 20pt;
            }

            h2 {
                font-size: x-large;
                margin-left: 20pt;
                margin-bottom: 8pt;
            }

            h3 {
                font-size: large;
                margin-left: 20pt;
                margin-bottom: 4pt;
            }

            h4 {
                font-size: medium;
                margin-bottom: 0pt;
            }

            section > p {
                margin-left: 24pt;
                margin-bottom: 6pt;
            }

            div.row {
                padding-right: 24pt;
            }

            section {
                margin-top: 24pt;
            }

            summary {
                padding: 10pt;
            }

            .status-cards {
                display: flex;
                gap: 8pt;
                padding-right: 24pt;
            }

            .status-card {
                cursor: pointer;
                border: 1pt solid transparent;
            }

            .status-card.selected[data-status="compliant"] { border-color: var(--compliant); }
            .status-card.selected[data-status="progress"] { border-color: var(--warning); }
            .status-card.selected[data-status="non-compliant"] { border-color: var(--destructive); }

            .status-card:focus-visible {
                outline: 2px solid var(--focus-ring);
                outline-offset: 2px;
            }

            .status-label {
                margin: 4pt 0 0;
                font-weight: bold;
            }

            .status-criteria {
                font-size: 8pt;
                margin: 2pt 0 0;
                font-weight: normal;
            }

            .improvement-action {
                margin-top: 6pt;
                font-style: italic;
            }

            textarea.notes {
                width: 100%;
                min-height: 40pt;
                margin-top: 6pt;
                font-family: var(--font-sans);
            }

            .summary-section {
                display: flex;
                align-items: baseline;
                gap: 24pt;
                margin-left: 20pt;
            }

            .summary-heading {
                font-size: large;
                font-weight: bold;
            }

            .classify-columns {
                display: flex;
                gap: 16pt;
                flex-wrap: wrap;
            }

            .classify-column {
                flex: 1 1 240pt;
            }

            .field {
                display: block;
                margin-bottom: 8pt;
            }

            .field span {
                display: block;
                font-weight: bold;
                margin-bottom: 2pt;
            }

            .field input,
            .field textarea {
                width: 100%;
            }

            #sidebar-footer button {
                display: block;
                width: 100%;
                margin-top: var(--space-2);
            }

            #sidebar-footer svg {
                max-width: 100%;
                height: auto;
            }

            .badge-wrap {
                position: relative;
                display: inline-block;
            }

            .hovercard {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 100%;
                z-index: 10;
                background: var(--card);
                color: var(--foreground);
                border: 1pt solid var(--border);
                border-radius: 4pt;
                padding: 8pt;
                font-size: 9pt;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.15s ease;
                pointer-events: none;
            }

            .badge-wrap:hover .hovercard,
            .badge-wrap:focus-within .hovercard {
                opacity: 1;
                visibility: visible;
            }

            [data-sidebar-toggle] {
                margin-bottom: var(--space-2);
            }

            .draft-label {
                margin-left: 8pt;
                padding: 1pt 6pt;
                font-size: 9pt;
                font-weight: normal;
                color: var(--warning);
                border: 1pt solid var(--warning);
                border-radius: 3pt;
                vertical-align: middle;
            }

            @media print {
                #sidebar-footer button,
                #export-import-accordion,
                [data-sidebar-toggle],
                aside[data-sidebar] > header,
                aside[data-sidebar] > nav {
                    display: none;
                }
                .status-card:not(.selected) {
                    display: none;
                }
                /* [data-sidebar-layout] fixes the page to 100dvh with an internally
                   scrolling <main> (oat.min.css) — reset to normal document flow so
                   jsPDF/print capture the whole assessment, not one viewport's worth. */
                #app-shell {
                    display: block;
                    height: auto;
                }
                #app-shell > aside[data-sidebar] {
                    height: auto;
                    border: none;
                    box-shadow: none;
                }
                #app-shell > main {
                    height: auto;
                    overflow: visible;
                }
            }

            body.printing #sidebar-footer button,
            body.printing #export-import-accordion,
            body.printing [data-sidebar-toggle],
            body.printing aside[data-sidebar] > header,
            body.printing aside[data-sidebar] > nav,
            body.printing .status-card:not(.selected) {
                display: none;
            }

            body.printing #app-shell {
                display: block;
                height: auto;
            }

            body.printing #app-shell > aside[data-sidebar] {
                height: auto;
                border: none;
                box-shadow: none;
            }

            body.printing #app-shell > main {
                height: auto;
                overflow: visible;
            }

            .status-icon {
                display: block;
            }

            .status-card[data-status="compliant"] .status-icon { color: var(--compliant); }
            .status-card[data-status="progress"] .status-icon { color: var(--warning); }
            .status-card[data-status="non-compliant"] .status-icon { color: var(--destructive); }
        </style>
        <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
        <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
        <script id="app-logic">
            const ACTIVITIES = {
                primary: {
                    title: "Primary research life cycle activities",
                    items: ["Discover", "Hypothesise", "Plan", "Collect", "Process", "Analyse", "Report"],
                },
                related: {
                    title: "Research related activities",
                    items: ["Manage & Organise", "Document & Preserve", "Review & Curate", "Publish & Communicate", "Evaluate & Monitor"],
                },
            };

            const ABOUT_TOOL_HTML =
                "<p>This tool lets Open Science infrastructure providers, projects, funders, and programme teams reflect on and self-assess how open science values and principles are put into practice in an infrastructure’s design, governance, and operation.</p>" +
                "<p>It grew out of the SPII project’s exploration of a shared self-assessment approach for open science infrastructures. Rather than building a bespoke framework from scratch, we chose to begin with an existing, community-governed framework — the <a href=\"https://openscholarlyinfrastructure.org/\">Principles of Open Scholarly Infrastructure (POSI)</a> — so infrastructures can assess themselves against criteria the wider community already recognises, and so results can be compared and shared. The tool is designed to support additional assessment frameworks over time, not just POSI.</p>" +
                "<p>The underlying values — quality and integrity, collective benefit, and equity, fairness, diversity and inclusion — draw on UNESCO’s Open Science Recommendation and the Dutch National Plan Open Science (NPOS).</p>";

            const ICONS = {
                compliant: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="8.5" /><path d="M6 10.5l2.5 2.5L14 7.5" stroke-linecap="round" stroke-linejoin="round" /></svg>',
                progress: '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="8.5" /><path d="M10 5.5v5l3 2" stroke-linecap="round" stroke-linejoin="round" /></svg>',
                "non-compliant": '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="8.5" /><path d="M7 7l6 6M13 7l-6 6" stroke-linecap="round" /></svg>',
            };

            function today_iso_date() {
                const d = new Date();
                return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
            }

            const POSI = [
                {
                    section: "Governance",
                    sourceUrl: "https://openscholarlyinfrastructure.org/#governance",
                    principles: [
                        { id: "coverage", title: "Coverage across the scholarly enterprise", text: "Research transcends disciplines, geography, institutions, and stakeholders. Organisations and the infrastructure they run need to reflect this." },
                        { id: "stakeholder-governed", title: "Stakeholder governed", text: "A board-governed organisation drawn from the stakeholder community builds confidence that the organisation will make decisions driven by community consensus and a balance of interests." },
                        { id: "non-discriminatory", title: "Non-discriminatory participation or membership", text: "We see the best option to be an “opt-in” approach with principles of non-discrimination and inclusivity, where any relevant group may express an interest and should be welcome. Representation in governance must reflect the character of the community or membership." },
                        { id: "transparent-governance", title: "Transparent governance", text: "To foster trust, the processes and policies for governing the organisation and selecting representatives to governance groups should be transparent (within the constraints of privacy laws)." },
                        { id: "cannot-lobby", title: "Cannot lobby", text: "Infrastructure organisations should not lobby for regulatory change to cement their own positions or narrow self-interest. However, an infrastructure organisation’s role is to support its community, and this can include advocating for policy changes." },
                        { id: "living-will", title: "Living will", text: "To build trust, organisations should establish and communicate clear commitments regarding their long-term stewardship responsibilities, including the principles by which assets, data, resources, services, and staff would be responsibly transferred to a successor or the organisation or service wound down. The commitments should address future governance, with defined criteria for acceptable successor organisations. This should include continued alignment with POSI and any legal or structural constraints." },
                        { id: "regular-review", title: "Regular review of purpose and community value", text: "Organisations and services should regularly review their relevance, effectiveness, and the level of community support to determine whether their continued operation is necessary. If no longer needed, they should take responsible steps to transition or wind down operations in consultation with the community and in alignment with their living will." },
                    ],
                },
                {
                    section: "Sustainability",
                    sourceUrl: "https://openscholarlyinfrastructure.org/#sustainability",
                    principles: [
                        { id: "transparent-operations", title: "Transparent operations", text: "To enable organisational accountability and openness, the operating policies and procedures, detailed financials, sustainability models, fees, strategic and product roadmaps, organisational charts, and other appropriate operational information should be made openly available (within the constraints of privacy laws). Information should be available for investigation and reuse by the community." },
                        { id: "time-limited-funds", title: "Time-limited funds are used only for time-limited activities", text: "Operations should be supported by sustainable revenue sources, whereas time-limited funds are used only for time-limited activities. Depending on grants to fund ongoing and/or long-term operations fully makes organisations fragile and distracts from maintaining core infrastructure." },
                        { id: "generate-surplus", title: "Goal to generate surplus", text: "It is not enough to merely survive; organisations and services have to be able to adapt and change. Organisations and services that define long-term sustainability based only on recovering costs risk becoming brittle and stagnant. To weather economic, social and technological volatility, organisations and services need financial resources beyond immediate operating costs." },
                        { id: "financial-reserves", title: "Establish and maintain financial reserves guided by policy", text: "Organisations and services should have a clear policy on maintaining financial reserves, including the purpose, minimum and maximum level, and governance of these funds. The actual level of reserves should be determined and periodically reviewed by the governing body, ensuring that resources are available to support Living Will implementation, including an orderly wind-down, transition to a successor, or response to major unforeseen events. A financial reserve policy might include how funds will be held, under what circumstances they will be used, and how much would be necessary for an adequate wind-down or transfer of assets, given the complexity of the organisation’s infrastructure." },
                        { id: "mission-consistent-revenue", title: "Mission-consistent revenue generation", text: "Revenue sources should be evaluated against the infrastructure’s mission and not run counter to the aims of the organisation or service." },
                        { id: "revenue-not-data", title: "Revenue generated from services, not data", text: "Data related to the running of the scholarly infrastructure should be community property. Appropriate revenue sources might include value-added services, consulting, API Service Level Agreements, or membership fees." },
                        { id: "volunteer-labour", title: "Volunteer labour", text: "Organisations that rely on volunteers and their labour should recognise this as a valuable resource for the organisation’s long-term viability, and factor it into sustainability planning and risk management." },
                        { id: "transition-planning", title: "Transition planning", text: "Organisations that are heavily dependent on a limited number of individuals should take steps to reduce their dependence on these individuals, including via transition and succession planning, so that the organisation is not at risk of collapse in the event of their departure." },
                    ],
                },
                {
                    section: "Insurance",
                    sourceUrl: "https://openscholarlyinfrastructure.org/#insurance",
                    principles: [
                        { id: "open-source", title: "Open source", text: "All software and non-physical assets required to run the infrastructure should be available under an open-source licence. This does not include other software that may be involved with running the organisation." },
                        { id: "open-secure-data", title: "Ensure open and secure data accessibility within legal and ethical constraints", text: "To support potential forking or replication, infrastructure should aim to make all relevant data openly available, following best practices such as applying a CC0 waiver where appropriate. This must be balanced with compliance with privacy, data protection, and security requirements. Organisations should have a clear policy outlining how private or sensitive data will be handled—particularly in the event of a transfer to another organisation—to ensure continuity, legal compliance, and responsible stewardship." },
                        { id: "available-preserved", title: "Available and preserved", text: "It is not enough that content, data, and software be “open” if there is no practical way to obtain them. These resources should be made easily available with clear public documentation about where they are and how to access them, as well as an open licence where possible. It is not enough that “open” resources are available. In line with the Living Will, it is essential to deposit content, data, and software with at least one trusted third-party digital archive." },
                        { id: "patent-non-assertion", title: "Patent non-assertion", text: "The organisation should commit to a patent non-assertion policy or covenant. The organisation may obtain patents to protect its own operations, but not use them to prevent the community from replicating the infrastructure." },
                        { id: "interoperability-standards", title: "Prioritise interoperability and open standards to ensure continuity and resilience", text: "Infrastructures should adopt and support widely accepted open standards—both formal and de facto—to ensure that systems, data, and services can be replicated, migrated, or integrated with minimal disruption without the use of proprietary extensions or software. Where relevant, organisations should document dependencies on standards." },
                    ],
                },
            ];

            const SPII = [
                {
                    section: "Openness",
                    sourceUrl: "https://zenodo.org/record/7433767",
                    principles: [
                        { id: "spii-governance", title: "Governance", text: "Transparency of how the infrastructure is governed — decision-making bodies, policies, and how the community can see and influence them.", criteria: { compliant: "Governance structures, decision-making processes, and policies are fully documented and publicly available.", progress: "Some governance information is public, but key decisions or policies are not consistently documented or disclosed.", "non-compliant": "Governance is opaque; decision-making processes are not documented or accessible to the community." }, improvementAction: "Publish governance charters, meeting minutes/decisions, and policy documents openly." },
                        { id: "spii-operations", title: "Operations", text: "Transparency of day-to-day operations — how the infrastructure runs, its procedures, and operational metrics.", criteria: { compliant: "Operational procedures, SLAs, incident reports, and key operational metrics are openly published and kept up to date.", progress: "Some operational information is shared, but not consistently or not comprehensively.", "non-compliant": "Operational practices are undocumented or not shared with users/community." }, improvementAction: "Publish operating procedures and regularly updated status/incident reports." },
                        { id: "spii-provenance", title: "Provenance", text: "Ability to trace the origin, custody, and changes of data, content, software, and decisions within the infrastructure.", criteria: { compliant: "Full provenance (origin, versioning, custody chain) is tracked and exposed for data, software, and content.", progress: "Provenance is tracked internally but not consistently exposed or documented for users.", "non-compliant": "Provenance information is not tracked or is unavailable." }, improvementAction: "Implement provenance tracking (e.g. versioning, changelogs, PID-linked history)." },
                        { id: "spii-economical", title: "Economical", text: "Transparency about the financial model — costs, funding sources, pricing, and how money flows through the infrastructure.", criteria: { compliant: "Detailed financials, funding sources, and cost/pricing models are openly published.", progress: "High-level financial information is available, but details (e.g. cost breakdowns, funding sources) are limited or inconsistent.", "non-compliant": "Financial information is not disclosed." }, improvementAction: "Publish an annual financial transparency report." },
                        { id: "spii-strategical", title: "Strategical", text: "Transparency about strategic direction — roadmaps, priorities, and long-term plans.", criteria: { compliant: "Strategic/product roadmaps and priorities are publicly available and regularly updated.", progress: "A roadmap exists but is not public, not regularly updated, or lacks detail.", "non-compliant": "No strategic roadmap exists or is shared." }, improvementAction: "Publish and maintain a public strategic roadmap." },
                        { id: "spii-accessibility", title: "Accessibility", text: "The infrastructure’s software, data, APIs, and outputs are openly accessible, using open standards and licences, secured by design, and reachable by all relevant users including citizen scientists.", criteria: { compliant: "Software is open-source, data/metadata/APIs are open, licences are clear and open, the infrastructure runs on a public/open infrastructure stack, security is built-in by design, and identity/access management supports broad access including citizen scientists.", progress: "Some components are open (e.g. open data or open-source software) but others remain closed, proprietary, or access-restricted.", "non-compliant": "Software, data, APIs, or access are closed/proprietary with no clear licensing or public access path." }, improvementAction: "Work through the open-X checklist — open-source software, open data, open APIs, open repositories, open metadata, open licences, public infrastructure stack, security-by-design, and inclusive IAM." },
                    ],
                },
                {
                    section: "Autonomy",
                    sourceUrl: "https://zenodo.org/record/7433767",
                    principles: [
                        { id: "spii-stakeholder-governed", title: "Stakeholder governed/community-led", text: "The infrastructure is governed by its stakeholder community rather than a single external party.", criteria: { compliant: "A representative governing body drawn from the stakeholder community makes key decisions, with documented community input mechanisms.", progress: "Some community input is solicited, but governance is largely controlled by a single organisation or vendor.", "non-compliant": "Governance is entirely external/vendor-controlled with no community input." }, improvementAction: "Establish a stakeholder governing board and open, non-discriminatory participation." },
                        { id: "spii-discipline-specific", title: "Discipline-specific", text: "The infrastructure is fit for the specific needs, norms, and workflows of its research discipline(s).", criteria: { compliant: "The infrastructure is explicitly designed and regularly reviewed against the needs of its target discipline(s), with documented fit-for-purpose criteria.", progress: "Some discipline-specific needs are addressed, but the infrastructure is largely generic and not tailored.", "non-compliant": "No consideration of discipline-specific needs; infrastructure is a one-size-fits-all solution regardless of context." }, improvementAction: "Run periodic fit-for-purpose reviews with discipline representatives." },
                        { id: "spii-digital-sovereignty", title: "Digital sovereignty", text: "The infrastructure safeguards digital and academic sovereignty — control over data, infrastructure, and decisions stays with the academic community rather than being ceded to external commercial or geopolitical interests.", criteria: { compliant: "Data, infrastructure control, and critical decisions remain within community/academic governance; dependency on external vendors is actively managed with exit strategies.", progress: "Some dependency on external vendors/platforms exists, with partial mitigation (e.g. contractual safeguards) but no full exit strategy.", "non-compliant": "Critical infrastructure or data is fully dependent on external vendors/platforms with no contractual safeguards or exit plan." }, improvementAction: "Adopt value-driven procurement, balance agency against costs & risks, and put contractual clauses and exit strategies in place — consider using the Digital Autonomy Assessment Framework for a deeper dive." },
                        { id: "spii-responsibility", title: "Responsibility", text: "Clear ownership of responsibilities for the infrastructure’s operation, decisions, and consequences.", criteria: { compliant: "Responsibilities are clearly assigned, documented, and regularly reviewed against the infrastructure’s purpose and community value.", progress: "Some responsibilities are assigned but not comprehensively documented or reviewed.", "non-compliant": "Responsibilities are unclear or undocumented." }, improvementAction: "Document a responsibility matrix (who is accountable for what) and schedule regular reviews of purpose and community value." },
                    ],
                },
                {
                    section: "Sustainability",
                    sourceUrl: "https://zenodo.org/record/7433767",
                    principles: [
                        { id: "spii-financial-sustainability", title: "Financial sustainability", text: "The infrastructure has a sustainable financial model beyond short-term grants.", criteria: { compliant: "Structural/recurrent funding is secured (e.g. memberships, recurrent grants), with a mission-consistent revenue model and clear cost-of-ownership understanding.", progress: "Funding is time-limited (e.g. a one-off grant) with plans underway to secure recurrent funding.", "non-compliant": "No funding secured for the foreseeable future." }, improvementAction: "Develop mission-consistent revenue generation and a total-cost-of-ownership analysis; consider make-or-buy guidelines." },
                        { id: "spii-human-capacity", title: "Human capacity sustainability", text: "Sufficient, resilient staffing to operate and maintain the infrastructure.", criteria: { compliant: "A dedicated, adequately resourced team maintains the infrastructure, with succession/continuity planning in place.", progress: "The infrastructure is maintained but relies heavily on one or few individuals with no succession plan.", "non-compliant": "No one is actively maintaining the infrastructure." }, improvementAction: "Build a resourcing/succession plan and invest in sustained maintenance capacity." },
                        { id: "spii-legal-compliance", title: "Legal and institutional compliance", text: "The infrastructure meets applicable legal and institutional requirements.", criteria: { compliant: "Legal/regulatory compliance (e.g. data protection, IP, institutional policy) is actively managed, documented, and audited or certified.", progress: "Compliance is partially addressed, with known gaps being worked on.", "non-compliant": "Compliance status is unknown or has major gaps." }, improvementAction: "Conduct a compliance audit and address gaps against relevant legal/institutional requirements." },
                        { id: "spii-enduring-availability", title: "Enduring availability", text: "The infrastructure and its outputs remain available over the long term, with plans for what happens if it winds down.", criteria: { compliant: "A documented end-of-life/succession policy exists, content is deposited with trusted third-party archives, and continuity of the public stack is supported.", progress: "Some continuity measures exist (e.g. backups) but no formal end-of-life policy or archival deposit.", "non-compliant": "No continuity plan; data/content would be lost if the infrastructure stopped." }, improvementAction: "Publish an end-of-life policy (a “living will”) and deposit outputs with a trusted third-party digital archive." },
                    ],
                },
                {
                    section: "Interoperability",
                    sourceUrl: "https://zenodo.org/records/6074944",
                    principles: [
                        { id: "spii-technical-interoperability", title: "Technical interoperability", text: "Systems, data and services can be connected, migrated or integrated using open, syntactic standards.", criteria: { compliant: "The infrastructure uses open standards, persistent identifiers (PIDs), and maintains active connections to relevant international infrastructures.", progress: "Some open standards/PIDs are used, but integration with international infrastructures is limited or ad hoc.", "non-compliant": "Proprietary formats/protocols are used with no PIDs and no external connections." }, improvementAction: "Adopt open standards and PIDs, and establish connections to relevant international infrastructures." },
                        { id: "spii-organisational-interoperability", title: "Organisational & social interoperability", text: "Shared semantics — vocabularies and ontologies — enable the infrastructure’s data and processes to be understood consistently across organisations and communities.", criteria: { compliant: "Community-recognised vocabularies/ontologies are used consistently and documented.", progress: "Some shared vocabularies are used, but inconsistently or without documentation.", "non-compliant": "No shared vocabularies/ontologies are used; semantics are ad hoc or undocumented." }, improvementAction: "Adopt and document relevant community vocabularies/ontologies." },
                        { id: "spii-legal-interoperability", title: "Legal interoperability", text: "Clear, compatible terms of use enable data, software, and content to be legally reused and combined across systems.", criteria: { compliant: "Terms of use are clear, machine-readable where possible, and compatible with common open licences used by peer infrastructures.", progress: "Terms of use exist but are unclear, inconsistent, or not machine-readable.", "non-compliant": "No clear terms of use, or terms actively conflict with reuse/interoperability." }, improvementAction: "Publish clear, standard, machine-readable terms of use aligned with common open licences." },
                    ],
                },
                {
                    section: "Researcher-centric",
                    sourceUrl: "https://doi.org/10.1038/s41597-020-0486-7",
                    principles: [
                        { id: "spii-seamless-ux", title: "Seamless user-experience", text: "The infrastructure is designed around researchers’ actual workflows and needs.", criteria: { compliant: "User-driven design practices (e.g. user research, usability testing) are embedded in the infrastructure’s development process, and adoption/satisfaction is actively monitored.", progress: "Some user feedback is gathered, but design is not systematically user-driven.", "non-compliant": "No user research or feedback process exists; design decisions are made without researcher input." }, improvementAction: "Establish ongoing user-driven design practices (user research, usability testing, feedback loops)." },
                        { id: "spii-recognition-rewards", title: "Recognition and rewards", text: "Contributions made via the infrastructure (e.g. data, code, review, curation) are recognised and rewarded within academic evaluation and career systems.", criteria: { compliant: "The infrastructure actively supports recognition and rewards for contributions (e.g. integrates with CRediT, ORCID, institutional recognition/reward frameworks).", progress: "Some recognition mechanisms exist (e.g. basic attribution) but are not integrated with formal reward/evaluation systems.", "non-compliant": "No mechanism exists to recognise or reward contributions made via the infrastructure." }, improvementAction: "Integrate with recognition and rewards frameworks (e.g. CRediT, institutional recognition policies)." },
                    ],
                },
            ];

            const FRAMEWORKS = [
                {
                    id: "posi",
                    title: "POSI v2.0 Assessment",
                    shortName: "POSI",
                    description: "A community-maintained framework covering governance, sustainability, and insurance against lock-in for scholarly infrastructure.",
                    aboutHtml:
                        "<p>The Principles of Open Scholarly Infrastructure (POSI) is a community-maintained framework (v2.0, released October 2025) covering three areas: <strong>Governance</strong> (who’s accountable and how), <strong>Sustainability</strong> (financial and operational resilience), and <strong>Insurance</strong> (protection against lock-in or failure — open source, open data, patent non-assertion). Read the full principles at <a href=\"https://openscholarlyinfrastructure.org/\">openscholarlyinfrastructure.org</a>.</p>" +
                        "<p>Cite as: POSI Adopters (2025), <em>The Principles of Open Scholarly Infrastructure</em>, <a href=\"https://doi.org/10.14454/G8WV-VM65\">https://doi.org/10.14454/G8WV-VM65</a>.</p>",
                    sections: POSI,
                },
                {
                    id: "spii",
                    title: "SPII v0.0.1 Assessment",
                    shortName: "SPII",
                    description: "A community-drafted framework (v0.0.1, June 2026 consultation) covering openness, autonomy, sustainability, interoperability, and researcher-centricity for open science infrastructure.",
                    aboutHtml:
                        "<p>SPII (version 0.0.1) is a draft assessment framework developed through the SPII project’s community consultation, concluding in June 2026. It reflects five principles — Openness, Autonomy, Sustainability, Interoperability, and Researcher-centric — each broken into subprinciples with concrete actions, enablers, and practices infrastructures can adopt.</p>" +
                        "<p>The framework’s underlying values — quality and integrity, collective benefit, and equity, fairness, diversity and inclusion — draw on UNESCO’s Open Science Recommendation and the Dutch National Plan Open Science (NPOS). This is a v0.0.1 draft: principles and criteria may change as community feedback continues.</p>" +
                        "<p>References: NPOS, <em>Open Science 2030 in the Netherlands: NPOS2030 Ambition Document and Rolling Agenda</em> (2022), <a href=\"https://zenodo.org/record/7433767\">https://zenodo.org/record/7433767</a>. UNESCO, <em>Recommendation on Open Science</em>, <a href=\"https://unesdoc.unesco.org/ark:/48223/pf0000379949\">unesdoc.unesco.org</a>. Lin, D. et al., <em>The TRUST Principles for digital repositories</em>, Sci. Data 7, 144 (2020), <a href=\"https://doi.org/10.1038/s41597-020-0486-7\">https://doi.org/10.1038/s41597-020-0486-7</a>. <em>The Principles of Open Scholarly Infrastructure</em> (v2.0, 2025), <a href=\"https://openscholarlyinfrastructure.org/\">openscholarlyinfrastructure.org</a>. Bijsterbosch, M. et al., <em>Seven Guiding Principles for Open Research Information</em> (2022), <a href=\"https://zenodo.org/records/6074944\">https://zenodo.org/records/6074944</a>. Universities of the Netherlands, <em>A new open access strategy for the Netherlands</em> (2026), <a href=\"https://doi.org/10.5281/zenodo.19548009\">https://doi.org/10.5281/zenodo.19548009</a>.</p>",
                    draft: true,
                    sections: SPII,
                },
            ];

            function initial_state() {
                const frameworks = {};
                FRAMEWORKS.forEach((framework) => {
                    const entries = {};
                    framework.sections.forEach((section) => {
                        section.principles.forEach((principle) => {
                            entries[principle.id] = { status: null, notes: "" };
                        });
                    });
                    frameworks[framework.id] = entries;
                });
                return {
                    name: "",
                    description: "",
                    url: "",
                    assessedOn: today_iso_date(),
                    activities: [],
                    frameworks,
                };
            }

            function compute_summary(state, frameworkId) {
                const entries = Object.values(state.frameworks[frameworkId] || {});
                const scored = entries.filter((e) => e.status !== null);
                const compliant = scored.filter((e) => e.status === "compliant").length;
                const progress = scored.filter((e) => e.status === "progress").length;
                const nonCompliant = scored.filter((e) => e.status === "non-compliant").length;
                const percentCompliant = scored.length ? Math.round((compliant / scored.length) * 100) : 0;
                return {
                    compliant,
                    progress,
                    nonCompliant,
                    scoredCount: scored.length,
                    totalCount: entries.length,
                    percentCompliant,
                };
            }

            function build_export_object(state) {
                const frameworks = {};
                Object.keys(state.frameworks).forEach((frameworkId) => {
                    const entries = {};
                    Object.keys(state.frameworks[frameworkId]).forEach((id) => {
                        entries[id] = { status: state.frameworks[frameworkId][id].status, notes: state.frameworks[frameworkId][id].notes };
                    });
                    frameworks[frameworkId] = entries;
                });
                return {
                    name: state.name,
                    description: state.description,
                    url: state.url,
                    assessedOn: state.assessedOn,
                    activities: state.activities.slice(),
                    frameworks,
                };
            }

            function merge_loaded_state(loaded) {
                const fresh = initial_state();
                if (!loaded || typeof loaded !== "object") return fresh;
                if (typeof loaded.name === "string") fresh.name = loaded.name;
                if (typeof loaded.description === "string") fresh.description = loaded.description;
                if (typeof loaded.url === "string") fresh.url = loaded.url;
                fresh.assessedOn = typeof loaded.assessedOn === "string" && /^\d{4}-\d{2}-\d{2}$/.test(loaded.assessedOn) ? loaded.assessedOn : today_iso_date();
                if (Array.isArray(loaded.activities)) fresh.activities = loaded.activities.slice();
                if (loaded.frameworks && typeof loaded.frameworks === "object") {
                    Object.keys(fresh.frameworks).forEach((frameworkId) => {
                        const loadedFramework = loaded.frameworks[frameworkId];
                        if (!loadedFramework || typeof loadedFramework !== "object") return;
                        Object.keys(fresh.frameworks[frameworkId]).forEach((id) => {
                            const entry = loadedFramework[id];
                            if (entry && typeof entry === "object") {
                                fresh.frameworks[frameworkId][id].status = ["compliant", "progress", "non-compliant"].includes(entry.status) ? entry.status : null;
                                fresh.frameworks[frameworkId][id].notes = typeof entry.notes === "string" ? entry.notes : "";
                            }
                        });
                    });
                }
                return fresh;
            }

            function ring_segment_offsets(radius, count) {
                const circumference = 2 * Math.PI * radius;
                const segmentLength = circumference / count;
                const gap = circumference - segmentLength;
                const offsets = [];
                for (let i = 0; i < count; i++) {
                    offsets.push({
                        dasharray: segmentLength + " " + gap,
                        dashoffset: -(i * segmentLength),
                    });
                }
                return offsets;
            }
        </script>
    </head>
    
    <body>

        <div data-sidebar-layout id="app-shell">
            <aside data-sidebar>
                <header>
                    <h2>Open Science infrastructure Self-assessment Tool</h2>
                </header>
                <nav id="sidebar-nav"></nav>
                <footer id="sidebar-footer"></footer>
            </aside>
            <main id="app"></main>
        </div>

        <script id="app-render">
            let state = initial_state();
            let activeFrameworkId = FRAMEWORKS[0].id;

            function render() {
                const app = document.getElementById("app");
                app.innerHTML = "";
                app.appendChild(render_header());
                app.appendChild(render_infra_description_section());
                FRAMEWORKS.forEach((framework) => app.appendChild(render_framework_section(framework)));
                render_sidebar_nav();
                render_sidebar_footer();
                wire_up_events();
                update_summary();
                update_badge();
            }

            function render_sidebar_nav() {
                const nav = document.getElementById("sidebar-nav");
                nav.innerHTML = "";
                const ul = document.createElement("ul");

                ul.appendChild(render_nav_link("#about-section", "About"));
                ul.appendChild(render_nav_link("#infra-description-section", "OS Infrastructure Description"));

                FRAMEWORKS.forEach((framework) => {
                    const li = document.createElement("li");
                    const groupDetails = document.createElement("details");
                    groupDetails.open = true;
                    const summary = document.createElement("summary");
                    const a = document.createElement("a");
                    a.href = "#framework-" + framework.id;
                    a.textContent = framework.title + (framework.draft ? " (draft)" : "");
                    summary.appendChild(a);
                    a.addEventListener("click", (e) => {
                        e.stopPropagation();
                        activeFrameworkId = framework.id;
                        update_badge();
                    });
                    groupDetails.appendChild(summary);

                    const subUl = document.createElement("ul");
                    framework.sections.forEach((section) => {
                        const subLink = render_nav_link("#" + section_id(framework.id, section), section.section);
                        subLink.querySelector("a").addEventListener("click", () => {
                            activeFrameworkId = framework.id;
                            update_badge();
                        });
                        subUl.appendChild(subLink);
                    });
                    groupDetails.appendChild(subUl);

                    li.appendChild(groupDetails);
                    ul.appendChild(li);
                });

                nav.appendChild(ul);
            }

            function render_nav_link(href, label) {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = href;
                a.textContent = label;
                li.appendChild(a);
                return li;
            }

            function render_sidebar_footer() {
                const footer = document.getElementById("sidebar-footer");
                footer.innerHTML = "";

                const heading = document.createElement("h3");
                heading.textContent = "Assessment badge";
                footer.appendChild(heading);

                const badgeWrap = document.createElement("div");
                badgeWrap.className = "badge-wrap";
                badgeWrap.tabIndex = 0;
                const preview = document.createElement("div");
                preview.id = "badge-preview";
                badgeWrap.appendChild(preview);
                const hovercard = document.createElement("div");
                hovercard.id = "badge-hovercard";
                hovercard.className = "hovercard";
                badgeWrap.appendChild(hovercard);
                footer.appendChild(badgeWrap);

                const svgBtn = document.createElement("button");
                svgBtn.textContent = "Download badge (SVG)";
                svgBtn.addEventListener("click", download_badge_svg);
                footer.appendChild(svgBtn);

                const pngBtn = document.createElement("button");
                pngBtn.textContent = "Download badge (PNG)";
                pngBtn.addEventListener("click", download_badge_png);
                footer.appendChild(pngBtn);

                footer.appendChild(render_export_import_accordion());
            }

            function render_export_import_accordion() {
                const details = document.createElement("details");
                details.id = "export-import-accordion";
                const summary = document.createElement("summary");
                summary.textContent = "Export / import results";
                details.appendChild(summary);

                const downloadJsonBtn = document.createElement("button");
                downloadJsonBtn.textContent = "Download results as JSON";
                downloadJsonBtn.addEventListener("click", download_json);
                details.appendChild(downloadJsonBtn);

                const loadJsonLabel = document.createElement("label");
                loadJsonLabel.textContent = "Load JSON: ";
                const loadJsonInput = document.createElement("input");
                loadJsonInput.type = "file";
                loadJsonInput.id = "load-json-input";
                loadJsonInput.accept = "application/json";
                loadJsonInput.addEventListener("change", (e) => {
                    const file = e.target.files[0];
                    if (file) load_json(file);
                });
                loadJsonLabel.appendChild(loadJsonInput);
                details.appendChild(loadJsonLabel);

                const downloadPdfBtn = document.createElement("button");
                downloadPdfBtn.textContent = "Download report";
                downloadPdfBtn.addEventListener("click", download_pdf);
                details.appendChild(downloadPdfBtn);

                return details;
            }

            function render_header() {
                const wrap = document.createElement("div");

                const toggleBtn = document.createElement("button");
                toggleBtn.type = "button";
                toggleBtn.id = "sidebar-toggle";
                toggleBtn.setAttribute("data-sidebar-toggle", "");
                toggleBtn.setAttribute("aria-label", "Toggle navigation");
                toggleBtn.setAttribute("aria-expanded", "false");
                toggleBtn.textContent = "☰ Menu";
                wrap.appendChild(toggleBtn);

                const h1 = document.createElement("h1");
                h1.textContent = "Open Science Infrastructure Assessment Tool";
                wrap.appendChild(h1);

                const intro = document.createElement("p");
                intro.textContent = "Self-assess how your Open Science infrastructure puts open science values and principles into practice, against one or more community-recognised assessment frameworks.";
                wrap.appendChild(intro);

                const about = document.createElement("details");
                about.id = "about-section";
                about.innerHTML = "<summary>About this tool</summary>" + ABOUT_TOOL_HTML;
                wrap.appendChild(about);

                return wrap;
            }

            function render_framework_summary(framework) {
                const section = document.createElement("section");
                section.className = "summary-section";
                const heading = document.createElement("strong");
                heading.id = "summary-heading-" + framework.id;
                heading.className = "summary-heading";
                heading.textContent = "Overall: 0% compliant";
                const counts = document.createElement("span");
                counts.id = "summary-counts-" + framework.id;
                section.appendChild(heading);
                section.appendChild(counts);
                return section;
            }

            function render_framework_section(framework) {
                const section = document.createElement("section");
                section.id = "framework-" + framework.id;
                const h2 = document.createElement("h2");
                h2.textContent = framework.title;
                if (framework.draft) {
                    const draftLabel = document.createElement("span");
                    draftLabel.className = "draft-label";
                    draftLabel.textContent = "Draft – work in progress";
                    h2.appendChild(draftLabel);
                }
                section.appendChild(h2);

                const desc = document.createElement("p");
                desc.textContent = framework.description;
                section.appendChild(desc);

                const about = document.createElement("details");
                about.innerHTML = "<summary>About " + framework.shortName + "</summary>" + framework.aboutHtml;
                section.appendChild(about);

                section.appendChild(render_framework_summary(framework));

                framework.sections.forEach((frameworkSection) => {
                    section.appendChild(render_framework_content_section(frameworkSection, framework.id));
                });

                return section;
            }

            function render_infra_description_section() {
                const section = document.createElement("section");
                section.id = "infra-description-section";
                const h2 = document.createElement("h2");
                h2.textContent = "OS Infrastructure Description";
                section.appendChild(h2);

                section.appendChild(render_text_field("infra-name", "Infrastructure name", state.name, "text", "name of the infrastructure"));
                section.appendChild(render_textarea_field("infra-description", "Description", state.description, "brief description of the infrastructure"));
                section.appendChild(render_text_field("infra-url", "Landing page URL", state.url, "url", "https://..."));
                section.appendChild(render_text_field("infra-assessed-on", "Assessment date", state.assessedOn, "date", ""));

                const classifyHeading = document.createElement("h3");
                classifyHeading.textContent = "Classify";
                section.appendChild(classifyHeading);
                const classifyIntro = document.createElement("p");
                classifyIntro.textContent = "This infrastructure supports the following activities:";
                section.appendChild(classifyIntro);

                const columns = document.createElement("div");
                columns.className = "classify-columns";
                columns.appendChild(render_activities_column(ACTIVITIES.primary));
                columns.appendChild(render_activities_column(ACTIVITIES.related));
                section.appendChild(columns);

                return section;
            }

            function render_text_field(id, labelText, value, type, placeholder) {
                const label = document.createElement("label");
                label.className = "field";
                label.htmlFor = id;
                const span = document.createElement("span");
                span.textContent = labelText;
                label.appendChild(span);
                const input = document.createElement("input");
                input.type = type;
                input.id = id;
                input.value = value;
                if (placeholder) input.placeholder = placeholder;
                label.appendChild(input);
                return label;
            }

            function render_textarea_field(id, labelText, value, placeholder) {
                const label = document.createElement("label");
                label.className = "field";
                label.htmlFor = id;
                const span = document.createElement("span");
                span.textContent = labelText;
                label.appendChild(span);
                const textarea = document.createElement("textarea");
                textarea.id = id;
                textarea.value = value;
                if (placeholder) textarea.placeholder = placeholder;
                label.appendChild(textarea);
                return label;
            }

            function render_activities_column(group) {
                const box = document.createElement("div");
                box.className = "card classify-column";
                const h4 = document.createElement("h4");
                h4.textContent = group.title;
                box.appendChild(h4);
                group.items.forEach((item) => {
                    const value = group.title + " > " + item;
                    box.appendChild(render_activity_checkbox(value, item));
                });
                return box;
            }

            function render_activity_checkbox(value, labelText) {
                const label = document.createElement("label");
                label.style.display = "block";
                const input = document.createElement("input");
                input.type = "checkbox";
                input.value = value;
                input.checked = state.activities.includes(value);
                label.appendChild(input);
                label.appendChild(document.createTextNode(" " + labelText));
                return label;
            }

            function section_id(frameworkId, section) {
                return frameworkId + "-" + section.section.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            }

            function render_framework_content_section(section, frameworkId) {
                const el = document.createElement("section");
                el.id = section_id(frameworkId, section);
                const h3 = document.createElement("h3");
                h3.textContent = section.section;
                el.appendChild(h3);
                const sourceNote = document.createElement("p");
                sourceNote.innerHTML = 'Source: <a href="' + section.sourceUrl + '">' + section.sourceUrl + "</a>";
                el.appendChild(sourceNote);
                section.principles.forEach((principle) => {
                    el.appendChild(render_principle(principle, frameworkId));
                });
                return el;
            }

            function render_principle(principle, frameworkId) {
                const details = document.createElement("details");
                details.className = "container";
                details.dataset.principleId = principle.id;
                details.dataset.frameworkId = frameworkId;

                const summary = document.createElement("summary");
                const h4 = document.createElement("h4");
                h4.textContent = principle.title;
                summary.appendChild(h4);
                details.appendChild(summary);

                const text = document.createElement("p");
                text.textContent = principle.text;
                details.appendChild(text);

                const cards = document.createElement("div");
                cards.className = "status-cards";
                cards.setAttribute("role", "group");
                cards.setAttribute("aria-label", principle.title + " maturity status");
                [
                    { status: "compliant", label: "Compliant" },
                    { status: "progress", label: "Making progress" },
                    { status: "non-compliant", label: "Not compliant" },
                ].forEach((option) => {
                    const card = document.createElement("article");
                    card.className = "card col-3 status-card";
                    card.dataset.status = option.status;
                    card.setAttribute("role", "button");
                    card.setAttribute("tabindex", "0");
                    card.setAttribute("aria-pressed", state.frameworks[frameworkId][principle.id].status === option.status ? "true" : "false");
                    if (state.frameworks[frameworkId][principle.id].status === option.status) {
                        card.classList.add("selected");
                    }
                    const icon = document.createElement("span");
                    icon.className = "status-icon";
                    icon.innerHTML = ICONS[option.status];
                    card.appendChild(icon);

                    const label = document.createElement("p");
                    label.className = "status-label";
                    label.textContent = option.label;
                    card.appendChild(label);

                    if (principle.criteria && principle.criteria[option.status]) {
                        const criteriaText = document.createElement("p");
                        criteriaText.className = "status-criteria";
                        criteriaText.textContent = principle.criteria[option.status];
                        card.appendChild(criteriaText);
                    }

                    cards.appendChild(card);
                });
                details.appendChild(cards);

                const notes = document.createElement("textarea");
                notes.className = "notes";
                notes.placeholder = "Explain your reasoning (optional)";
                notes.value = state.frameworks[frameworkId][principle.id].notes;
                details.appendChild(notes);

                if (principle.improvementAction) {
                    const improvement = document.createElement("p");
                    improvement.className = "improvement-action";
                    improvement.textContent = "To improve: " + principle.improvementAction;
                    details.appendChild(improvement);
                }

                return details;
            }

            function wire_up_events() {
                const nameInput = document.getElementById("infra-name");
                nameInput.addEventListener("input", (e) => {
                    state.name = e.target.value;
                    update_badge();
                });

                document.getElementById("infra-description").addEventListener("input", (e) => {
                    state.description = e.target.value;
                });

                document.getElementById("infra-url").addEventListener("input", (e) => {
                    state.url = e.target.value;
                });

                document.getElementById("infra-assessed-on").addEventListener("input", (e) => {
                    state.assessedOn = e.target.value;
                    update_badge();
                });

                document.getElementById("infra-description-section").addEventListener("change", (e) => {
                    if (e.target.matches('input[type="checkbox"]')) {
                        toggle_activity(e.target.value, e.target.checked);
                    }
                });

                document.getElementById("sidebar-toggle").addEventListener("click", (e) => {
                    const isOpen = document.getElementById("app-shell").toggleAttribute("data-sidebar-open");
                    e.currentTarget.setAttribute("aria-expanded", String(isOpen));
                });
            }

            function toggle_activity(label, checked) {
                if (checked) {
                    if (!state.activities.includes(label)) state.activities.push(label);
                } else {
                    state.activities = state.activities.filter((a) => a !== label);
                }
            }

            function set_status(frameworkId, principleId, status) {
                state.frameworks[frameworkId][principleId].status = state.frameworks[frameworkId][principleId].status === status ? null : status;
                const details = document.querySelector('[data-framework-id="' + frameworkId + '"][data-principle-id="' + principleId + '"]');
                details.querySelectorAll(".status-card").forEach((card) => {
                    const isSelected = card.dataset.status === state.frameworks[frameworkId][principleId].status;
                    card.classList.toggle("selected", isSelected);
                    card.setAttribute("aria-pressed", isSelected ? "true" : "false");
                });
                update_summary();
                update_badge();
            }

            function update_summary() {
                FRAMEWORKS.forEach((framework) => {
                    const summary = compute_summary(state, framework.id);
                    const heading = document.getElementById("summary-heading-" + framework.id);
                    const counts = document.getElementById("summary-counts-" + framework.id);
                    if (!heading || !counts) return;
                    heading.textContent = "Overall: " + summary.percentCompliant + "% compliant";
                    counts.textContent =
                        summary.compliant + " compliant · " + summary.progress + " making progress · " +
                        summary.nonCompliant + " not compliant (" + summary.scoredCount + "/" + summary.totalCount + " scored)";
                });
            }

            function download_json() {
                const data = build_export_object(state);
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: "application/json" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "results.json";
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 0);
            }

            function load_json(file) {
                const reader = new FileReader();
                reader.onload = () => {
                    let parsed;
                    try {
                        parsed = JSON.parse(reader.result);
                    } catch (err) {
                        alert("That file is not valid JSON.");
                        return;
                    }
                    state = merge_loaded_state(parsed);
                    render();
                };
                reader.readAsText(file);
            }

            function download_pdf() {
                const detailsElements = Array.from(document.querySelectorAll("details"));
                const openStates = detailsElements.map((el) => el.open);
                detailsElements.forEach((el) => el.setAttribute("open", ""));
                document.body.classList.add("printing");

                const doc = new jspdf.jsPDF();
                doc.html(document.body, {
                    callback: (doc) => {
                        doc.save("report.pdf");
                        document.body.classList.remove("printing");
                        detailsElements.forEach((el, i) => {
                            if (!openStates[i]) el.removeAttribute("open");
                        });
                    },
                    x: 10,
                    width: 200,
                    windowWidth: 1000,
                });
            }

            let detailsOpenBeforePrint = null;

            window.addEventListener("beforeprint", () => {
                const detailsElements = Array.from(document.querySelectorAll("details"));
                detailsOpenBeforePrint = detailsElements.map((el) => el.open);
                detailsElements.forEach((el) => el.setAttribute("open", ""));
            });

            window.addEventListener("afterprint", () => {
                if (!detailsOpenBeforePrint) return;
                const detailsElements = Array.from(document.querySelectorAll("details"));
                detailsElements.forEach((el, i) => {
                    if (!detailsOpenBeforePrint[i]) el.removeAttribute("open");
                });
                detailsOpenBeforePrint = null;
            });

            function ring_config_for(framework) {
                const count = framework.sections.length;
                const step = count > 1 ? Math.min(14, (76 - 34) / (count - 1)) : 14;
                return framework.sections.map((section, i) => ({
                    section: section,
                    radius: 34 + i * step,
                }));
            }

            const STATUS_COLOR_VAR = {
                compliant: "--compliant",
                progress: "--warning",
                "non-compliant": "--destructive",
            };

            function status_color(status) {
                const varName = STATUS_COLOR_VAR[status];
                if (!varName) return "#cccccc";
                const value = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
                return value || "#cccccc";
            }

            function escape_xml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function build_badge_svg_markup(state) {
                const width = 200;
                const height = 260;
                const center = width / 2;
                const ringCenterY = 140;
                const strokeWidth = 10;
                let circles = "";
                const framework = FRAMEWORKS.find((f) => f.id === activeFrameworkId);
                ring_config_for(framework).forEach((ring) => {
                    const section = ring.section;
                    const offsets = ring_segment_offsets(ring.radius, section.principles.length);
                    section.principles.forEach((principle, i) => {
                        const status = state.frameworks[framework.id][principle.id].status;
                        const color = status_color(status);
                        const off = offsets[i];
                        circles +=
                            '<circle cx="' + center + '" cy="' + ringCenterY + '" r="' + ring.radius +
                            '" fill="none" stroke="' + color + '" stroke-width="' + strokeWidth +
                            '" stroke-dasharray="' + off.dasharray + '" stroke-dashoffset="' + off.dashoffset +
                            '" transform="rotate(-90 ' + center + " " + ringCenterY + ')" />';
                    });
                });
                const summary = compute_summary(state, framework.id);
                const name = escape_xml(state.name || "Unnamed infrastructure");
                const date = escape_xml(state.assessedOn || "");
                const badgeTitle = escape_xml(framework.shortName + " Compliance");
                return (
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + " " + height + '" width="' + width + '" height="' + height + '">' +
                    '<rect width="' + width + '" height="' + height + '" fill="white" />' +
                    '<text x="' + center + '" y="24" text-anchor="middle" font-size="12" font-family="&quot;Source Sans 3&quot;, sans-serif" font-weight="bold">' + badgeTitle + "</text>" +
                    circles +
                    '<text x="' + center + '" y="' + (ringCenterY + 7) + '" text-anchor="middle" font-size="26" font-family="&quot;Source Sans 3&quot;, sans-serif" font-weight="bold">' + summary.percentCompliant + "%</text>" +
                    '<text x="' + center + '" y="228" text-anchor="middle" font-size="11" font-family="&quot;Source Sans 3&quot;, sans-serif">' + name + "</text>" +
                    '<text x="' + center + '" y="244" text-anchor="middle" font-size="10" font-family="&quot;Source Sans 3&quot;, sans-serif">' + date + "</text>" +
                    "</svg>"
                );
            }

            function update_badge() {
                const container = document.getElementById("badge-preview");
                if (!container) return;
                container.innerHTML = build_badge_svg_markup(state);
                const hovercard = document.getElementById("badge-hovercard");
                if (hovercard) hovercard.innerHTML = build_badge_hovercard_html(state);
            }

            function build_badge_hovercard_html(state) {
                const framework = FRAMEWORKS.find((f) => f.id === activeFrameworkId);
                const summary = compute_summary(state, framework.id);
                const name = state.name || "Unnamed infrastructure";
                let html = "<strong>" + escape_xml(name) + "</strong>";
                html += "<div>Assessed " + escape_xml(state.assessedOn) + "</div>";
                html += "<div>" + escape_xml(framework.shortName) + " overall: " + summary.percentCompliant + "%</div>";
                framework.sections.forEach((section) => {
                    let compliant = 0;
                    let progress = 0;
                    let nonCompliant = 0;
                    section.principles.forEach((principle) => {
                        const status = state.frameworks[framework.id][principle.id].status;
                        if (status === "compliant") compliant++;
                        else if (status === "progress") progress++;
                        else if (status === "non-compliant") nonCompliant++;
                    });
                    html += "<div>" + escape_xml(section.section) + ": " + compliant + "✓ " + progress + "◐ " + nonCompliant + "✗</div>";
                });
                return html;
            }

            function trigger_download(href, filename) {
                const link = document.createElement("a");
                link.href = href;
                link.download = filename;
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 0);
            }

            function download_badge_svg() {
                const markup = build_badge_svg_markup(state);
                const blob = new Blob([markup], { type: "image/svg+xml" });
                trigger_download(URL.createObjectURL(blob), "badge.svg");
            }

            function download_badge_png() {
                const markup = build_badge_svg_markup(state);
                const svgBlob = new Blob([markup], { type: "image/svg+xml" });
                const url = URL.createObjectURL(svgBlob);
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    canvas.width = 200;
                    canvas.height = 260;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    canvas.toBlob((blob) => {
                        if (!blob) {
                            alert("Could not generate the badge image.");
                            return;
                        }
                        trigger_download(URL.createObjectURL(blob), "badge.png");
                    });
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    alert("Could not generate the badge image.");
                };
                img.src = url;
            }

            document.getElementById("sidebar-nav").addEventListener("click", (e) => {
                if (e.target.tagName !== "A") return;
                document.getElementById("app-shell").removeAttribute("data-sidebar-open");
                document.getElementById("sidebar-toggle").setAttribute("aria-expanded", "false");
            }, true);

            const appRoot = document.getElementById("app");
            appRoot.addEventListener("click", (e) => {
                const card = e.target.closest(".status-card");
                if (!card) return;
                const details = card.closest("[data-principle-id]");
                set_status(details.dataset.frameworkId, details.dataset.principleId, card.dataset.status);
            });
            appRoot.addEventListener("input", (e) => {
                if (e.target.matches("textarea.notes")) {
                    const details = e.target.closest("[data-principle-id]");
                    state.frameworks[details.dataset.frameworkId][details.dataset.principleId].notes = e.target.value;
                }
            });
            appRoot.addEventListener("keydown", (e) => {
                if (e.key !== "Enter" && e.key !== " ") return;
                const card = e.target.closest(".status-card");
                if (!card) return;
                e.preventDefault();
                const details = card.closest("[data-principle-id]");
                set_status(details.dataset.frameworkId, details.dataset.principleId, card.dataset.status);
            });

            render();
        </script>
    </body>
</html>
